services:

  # ── Flat Circle Proxy ─────────────────────────────────────────────────────
  # Wraps any application. Point ORIGIN_URL at your existing app.
  # No code changes required. No SDK integration. Just DNS.
  #
  # The proxy listens on :8080 and forwards clean traffic to your origin.
  # Everything else — honeypots, behavioral analysis, shadow sessions,
  # Merkle audit trail, forensic export — happens transparently.
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8080:8080"
    environment:
      # ── Required ────────────────────────────────────────────────────────────
      # The application you want to protect. Any language. Any stack.
      # Express, FastAPI, Rails, Laravel, Spring Boot, Go, .NET — doesn't matter.
      ORIGIN_URL: ${ORIGIN_URL:-http://host.docker.internal:3000}

      # ── AI Providers (all optional — static fallback always active) ─────────
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}

      # ── Dashboard token (optional — leave blank to allow any connection) ────
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}

      # ── Forensic export (optional) ──────────────────────────────────────────
      FORENSIC_EXPORT_PATH: ${FORENSIC_EXPORT_PATH:-/data/forensic}
    volumes:
      - forensic-data:/data/forensic
      - ./flat-circle.yaml:/config/flat-circle.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Dashboard ─────────────────────────────────────────────────────────────
  # The organism. Real-time visualization of everything Flat Circle sees.
  # Connects to the proxy SSE stream at /flat-circle/stream.
  # Opens on :3001. CISO-facing. Not attacker-facing.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3001:80"
    environment:
      VITE_PROXY_URL: ${PROXY_URL:-http://localhost:8080}
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

volumes:
  forensic-data:
    driver: local
